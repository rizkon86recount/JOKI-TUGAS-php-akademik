services:
  php:
    build: .
    container_name: portal_akademik_php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: akademik
      DB_USER: akademik
      DB_PASS: akademik123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
          - "127.0.0.1:3307:3306"
    container_name: portal_akademik_db
    environment:
      MYSQL_DATABASE: akademik
      MYSQL_USER: akademik
      MYSQL_PASSWORD: akademik123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
